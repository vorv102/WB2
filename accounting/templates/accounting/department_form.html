{% extends "base.html" %}

{% block title %}{{ title }} — Учёт ПО{% endblock %}

{% block content %}
    <p><a href="{% url 'accounting:department_list' %}">← К подразделениям</a></p>
    <div class="page-head"><h1>{{ title }}</h1></div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn">Сохранить</button>
                <a href="{% url 'accounting:department_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
