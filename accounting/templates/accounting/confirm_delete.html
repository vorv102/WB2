{% extends "base.html" %}

{% block title %}Удаление — Учёт ПО{% endblock %}

{% block content %}
    <div class="form-card">
        <h1>Удалить {{ title }}?</h1>
        <p>Вы действительно хотите удалить «{{ object }}»? Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url back_url %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
